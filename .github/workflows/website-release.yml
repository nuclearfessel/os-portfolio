name: Release website ZIP

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/website-release.yml
      - scripts/package-claude-source.sh
      - scripts/validate-release-packages.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-website-zips:
    if: github.event_name == 'pull_request'
    name: Validate website ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release packages
        run: bash scripts/validate-release-packages.sh

  release-website-zip:
    if: github.ref == 'refs/heads/main'
    name: Build and release website ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release metadata
        id: release
        shell: bash
        run: |
          major=$(( (GITHUB_RUN_NUMBER - 1) / 99 + 1 ))
          minor=$(( (GITHUB_RUN_NUMBER - 1) % 99 + 1 ))
          printf -v version 'v%02d.%02d' "$major" "$minor"
          {
            echo "version=${version}"
            echo "tag=site-package-${version}"
            echo "site_zip=site-package-${version}.zip"
            echo "claude_zip=claude-src-pack.zip"
            echo "release_date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release packages
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.version }}
          VITE_RELEASE_CHANNEL: Stable
          VITE_RELEASE_COMMIT: ${{ github.sha }}
          VITE_RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          bash scripts/validate-release-packages.sh \
            "${{ steps.release.outputs.site_zip }}" \
            "${{ steps.release.outputs.claude_zip }}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SITE_ZIP: ${{ steps.release.outputs.site_zip }}
          CLAUDE_ZIP: ${{ steps.release.outputs.claude_zip }}
        run: |
          release_notes="Automated combined OS Portfolio site and Claude source packages for \`main\` at commit \`${GITHUB_SHA::7}\`. The site package includes OS Portfolio DS at \`/os-portfolio-ds/\`."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r legacy_asset; do
              [[ -n "$legacy_asset" ]] && gh release delete-asset "$RELEASE_TAG" "$legacy_asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(startswith("design-system-package-"))')
            gh release upload "$RELEASE_TAG" "$SITE_ZIP" "$CLAUDE_ZIP" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$SITE_ZIP" \
              "$CLAUDE_ZIP" \
              --target "$GITHUB_SHA" \
              --title "OS Portfolio packages ${RELEASE_VERSION}" \
              --notes "$release_notes"
          fi

      - name: Keep only the current and previous releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t old_releases < <(
            gh release list --limit 100 --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[2:] | .[].tagName'
          )
          for tag in "${old_releases[@]}"; do
            echo "Deleting old release: ${tag}"
            gh release delete "$tag" --yes
          done
