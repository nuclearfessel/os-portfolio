name: Release website ZIP

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/website-release.yml
      - scripts/package-claude-source.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-website-zips:
    if: github.event_name == 'pull_request'
    name: Validate website ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck portfolio
        run: pnpm --filter @workspace/desktop-portfolio run typecheck

      - name: Build portfolio
        run: pnpm --filter @workspace/desktop-portfolio run build

      - name: Typecheck design system
        run: pnpm --filter @workspace/portfolio-os-design-system run typecheck

      - name: Build design system
        run: pnpm --filter @workspace/portfolio-os-design-system run build

      - name: Package deployable website
        shell: bash
        run: |
          cd artifacts/desktop-portfolio/dist/public
          zip -qr "$GITHUB_WORKSPACE/site-package-validation.zip" .

      - name: Package Claude source
        shell: bash
        run: bash scripts/package-claude-source.sh claude-src-pack.zip

      - name: Package deployable design system
        shell: bash
        run: |
          cd artifacts/portfolio-os-design-system/dist
          zip -qr "$GITHUB_WORKSPACE/design-system-package-validation.zip" .

      - name: Verify ZIP integrity
        run: |
          unzip -tq site-package-validation.zip
          unzip -tq design-system-package-validation.zip
          unzip -tq claude-src-pack.zip

  release-website-zip:
    if: github.ref == 'refs/heads/main'
    name: Build and release website ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck portfolio
        run: pnpm --filter @workspace/desktop-portfolio run typecheck

      - name: Build portfolio
        run: pnpm --filter @workspace/desktop-portfolio run build

      - name: Typecheck design system
        run: pnpm --filter @workspace/portfolio-os-design-system run typecheck

      - name: Build design system
        run: pnpm --filter @workspace/portfolio-os-design-system run build

      - name: Create release metadata
        id: release
        shell: bash
        run: |
          major=$(( (GITHUB_RUN_NUMBER - 1) / 99 + 1 ))
          minor=$(( (GITHUB_RUN_NUMBER - 1) % 99 + 1 ))
          printf -v version 'v%02d.%02d' "$major" "$minor"
          {
            echo "version=${version}"
            echo "tag=site-package-${version}"
            echo "site_zip=site-package-${version}.zip"
            echo "design_system_zip=design-system-package-${version}.zip"
            echo "claude_zip=claude-src-pack.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Package deployable website
        shell: bash
        run: |
          cd artifacts/desktop-portfolio/dist/public
          zip -r "$GITHUB_WORKSPACE/${{ steps.release.outputs.site_zip }}" .

      - name: Package Claude source
        shell: bash
        run: bash scripts/package-claude-source.sh "${{ steps.release.outputs.claude_zip }}"

      - name: Package deployable design system
        shell: bash
        run: |
          cd artifacts/portfolio-os-design-system/dist
          zip -r "$GITHUB_WORKSPACE/${{ steps.release.outputs.design_system_zip }}" .

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SITE_ZIP: ${{ steps.release.outputs.site_zip }}
          DESIGN_SYSTEM_ZIP: ${{ steps.release.outputs.design_system_zip }}
          CLAUDE_ZIP: ${{ steps.release.outputs.claude_zip }}
        run: |
          release_notes="Automated deployable portfolio site, design-system site, and Claude source packages for \`main\` at commit \`${GITHUB_SHA::7}\`."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$SITE_ZIP" "$DESIGN_SYSTEM_ZIP" "$CLAUDE_ZIP" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$SITE_ZIP" \
              "$DESIGN_SYSTEM_ZIP" \
              "$CLAUDE_ZIP" \
              --target "$GITHUB_SHA" \
              --title "Portfolio OS packages ${RELEASE_VERSION}" \
              --notes "$release_notes"
          fi
