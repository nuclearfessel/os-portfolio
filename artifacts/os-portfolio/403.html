<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111326" />
    <title>403 | Directory unavailable</title>
    <link rel="icon" type="image/svg+xml" href="https://system-portfolio.com/favicon.svg" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

      :root {
        --background: 228 32% 9%;
        --foreground: 58 35% 91%;
        --primary: 66 100% 63%;
        --primary-foreground: 228 32% 9%;
        --secondary: 228 19% 18%;
        --muted-foreground: 228 12% 63%;
        --accent: 13 88% 68%;
        --border: 228 19% 22%;
        --ring: 66 100% 63%;
        --app-font-sans: 'Space Grotesk', sans-serif;
        --app-font-mono: 'DM Mono', monospace;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        color: hsl(var(--foreground));
        background: hsl(var(--background));
        font-family: var(--app-font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .error-page {
        position: relative;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 72px 24px 48px;
        background:
          linear-gradient(rgba(10, 12, 27, .34), rgba(10, 12, 27, .58)),
          url('https://system-portfolio.com/wallpaper-dark.jpg') center / cover no-repeat,
          #111326;
      }
      .error-page-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: .24;
        background-image:
          linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(to bottom, black, transparent 86%);
      }
      .error-page-system-bar {
        position: fixed;
        z-index: 2;
        inset: 0 0 auto;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        color: #aeb2cb;
        background: rgba(17, 19, 38, .78);
        border-bottom: 1px solid rgba(230, 255, 109, .12);
        font: 11px var(--app-font-mono);
        letter-spacing: .02em;
      }
      .error-page-system-mark { color: hsl(var(--primary)); }
      .error-page-window {
        position: relative;
        z-index: 1;
        width: min(620px, 100%);
        overflow: hidden;
        background: rgba(29, 31, 55, .96);
        border: 1px solid rgba(214, 221, 255, .18);
        border-radius: 10px;
        box-shadow: 0 28px 85px rgba(0, 0, 0, .55);
      }
      .error-page-window-bar {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        background: rgba(12, 14, 31, .74);
        border-bottom: 1px solid rgba(214, 221, 255, .12);
      }
      .error-page-window-title {
        color: hsl(var(--muted-foreground));
        font: 10px var(--app-font-mono);
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .error-page-content { padding: clamp(36px, 8vw, 72px); }
      .error-page-code {
        margin: 0 0 16px;
        color: hsl(var(--primary));
        font: 500 11px var(--app-font-mono);
        letter-spacing: .14em;
      }
      .error-page h1 {
        max-width: 500px;
        margin: 0;
        color: hsl(var(--foreground));
        font-size: clamp(36px, 8vw, 64px);
        line-height: .98;
        letter-spacing: -.045em;
      }
      .error-page-description {
        max-width: 470px;
        margin: 24px 0 0;
        color: hsl(var(--muted-foreground));
        font-size: 15px;
        line-height: 1.65;
      }
      .error-page-cta {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 30px;
        padding: 8px 12px;
        color: #111326;
        background: #e4ff5b;
        border: 1px solid #e4ff5b;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        line-height: normal;
        text-decoration: none;
        transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
      }
      .error-page-cta svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
      }
      .error-page-cta:hover {
        color: #e4ff5b;
        background: #2b2f4a;
        border-color: #e4ff5b;
      }
      .error-page-cta:focus-visible {
        outline: 2px solid #e4ff5b;
        outline-offset: 2px;
      }
      .error-page-status {
        position: fixed;
        z-index: 1;
        right: 18px;
        bottom: 16px;
        margin: 0;
        color: hsl(var(--muted-foreground));
        font: 10px var(--app-font-mono);
        letter-spacing: .08em;
      }
      .error-page-status span { color: hsl(var(--accent)); }

      @media (max-width: 520px) {
        .error-page { padding-inline: 14px; }
        .error-page-system-bar span:last-child { display: none; }
        .error-page-content { padding: 34px 26px 38px; }
        .error-page-status { right: 14px; bottom: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="error-page">
      <div class="error-page-grid" aria-hidden="true"></div>

      <header class="error-page-system-bar">
        <span class="error-page-system-mark">OS PORTFOLIO</span>
        <span>403 / DIRECTORY UNAVAILABLE</span>
      </header>

      <section class="error-page-window" aria-labelledby="error-title">
        <div class="error-page-window-bar" aria-hidden="true">
          <span class="error-page-window-title">access-control</span>
        </div>

        <div class="error-page-content">
          <p class="error-page-code">ERROR 403</p>
          <h1 id="error-title">There’s nothing to browse here.</h1>
          <p class="error-page-description">
            This directory is not publicly available. Return to the main site to
            explore selected work, approach, and experience.
          </p>
          <a class="error-page-cta" href="https://system-portfolio.com/">
            Back to main site
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </a>
        </div>
      </section>

      <p class="error-page-status" aria-hidden="true">
        ACCESS DENIED <span>•</span> REQUEST BLOCKED
      </p>
    </main>
  </body>
</html>
